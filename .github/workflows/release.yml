name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: pnpm electron-builder --mac --arm64 --publish never
            artifact: macos-arm64
          - os: windows-2022
            command: pnpm electron-builder --win --x64 --publish never
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Stage Apple API key for notarization
        if: matrix.os == 'macos-14' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/apple-api-key.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - run: ${{ matrix.command }}
        env:
          # Developer ID Application cert (macOS only); windows-2022 leaves these unset and
          # electron-builder falls back to the existing unsigned publish path.
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify Gatekeeper acceptance
        if: matrix.os == 'macos-14' && env.APPLE_API_KEY != ''
        run: |
          set -euo pipefail
          app=$(find dist -maxdepth 3 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*/*.dmg
            dist/*/*.zip
            dist/*/*-setup.exe
            dist/*/*.blockmap
            dist/*/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Litho ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
          find release -type f -exec gh release upload "$GITHUB_REF_NAME" {} \
            --repo "$GITHUB_REPOSITORY" --clobber \;
