appId: com.lithoapp.litho
productName: Litho
copyright: Copyright © 2026 Kareem Elbahrawy
directories:
  buildResources: build
  output: dist/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!dist/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Litho
    - CFBundleGetInfoString: Litho - PDF Design Tool
    - NSHumanReadableCopyright: Copyright © 2026 Kareem Elbahrawy
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  executableName: Litho
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: true
publish:
  provider: github
  owner: lithoapp
  repo: lithoapp
  channel: latest
