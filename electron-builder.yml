appId: com.lithoapp.litho
productName: Litho
copyright: Copyright © 2026 Kareem Elbahrawy
directories:
  buildResources: build
  output: dist/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!dist/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Litho
    - CFBundleGetInfoString: Litho - PDF Design Tool
    - NSHumanReadableCopyright: Copyright © 2026 Kareem Elbahrawy
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
win:
  executableName: Litho
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Kareem Elbahrawy
  category: Utility
  synopsis: PDF Design Tool
  description: Design and export beautiful PDFs with AI assistance
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: generic
  url: https://releases-api.lithoapp.com/v1/updates/
  channel: latest
