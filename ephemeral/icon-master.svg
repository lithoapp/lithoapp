<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!--
      Apple macOS icon grid: squircle is ~824×824 centered in 1024×1024.
      100px transparent inset on each side — matches other macOS app icons
      so the Cmd+Tab selection ring renders at the correct size.
      rx ≈ 22.5% of 824 = 185px
    -->
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <!-- Subtle radial gradient for depth -->
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </radialGradient>
  </defs>

  <!-- Everything clipped to squircle shape -->
  <g clip-path="url(#squircle)">
    <!-- Background fills the inset squircle area -->
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!--
      Logo viewBox: 671 564 706 920
      Squircle: 824×824 at (100,100), center at (512,512)
      Target logo height: 500px (~61% of squircle)
      Scale: 500/920 = 0.5435
      Scaled width: 706 * 0.5435 ≈ 384
      Offset x: (1024 - 384) / 2 = 320
      Offset y: (1024 - 500) / 2 = 262
    -->
    <g transform="translate(320,262) scale(0.5435) translate(-671,-564)">
      <!-- Vertical bar (dark rust) -->
      <path fill="#C2410C" d="M 671.587 564.932 L 868.454 564.969 L 868.902 1483 L 671.868 1482.98 C 670.491 1366.4 671.686 1247.51 671.673 1130.72 L 671.587 564.932 z"/>
      <!-- Horizontal bar (amber) -->
      <path fill="#D97706" d="M 1370.37 1288.5 L 1374.53 1288.59 C 1377.24 1293.29 1375.95 1457.84 1376 1482.97 L 911.75 1482.95 L 907.499 1482.81 C 907.112 1482.37 906.724 1481.94 906.337 1481.51 C 905.969 1439.23 906.19 1323 906.206 1288.69 L 1370.37 1288.5 z"/>
      <!-- Corner accent (orange) -->
      <path fill="#EA580C" d="M 906.031 599.612 C 911.205 603.744 944.576 637.279 950.972 644.092 C 970.544 664.941 1004.9 695.471 1022.37 716.966 C 983.526 717.677 944.505 717.174 905.62 717.6 C 905.816 681.022 904.135 635.013 906.031 599.612 z"/>
    </g>
  </g>
</svg>
